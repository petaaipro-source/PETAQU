name: Deploy fungsi QRIS
on:
  push:
    paths: ["supabase/**", ".github/workflows/deploy-supabase.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: fhulmqwuzswxrqjcioww
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Simpan kunci Midtrans
        run: supabase secrets set MIDTRANS_SERVER_KEY="${{ secrets.MIDTRANS_SERVER_KEY }}" MIDTRANS_ENV="${{ secrets.MIDTRANS_ENV || 'sandbox' }}" --project-ref "$PROJECT_REF"
      - name: Deploy
        run: supabase functions deploy --no-verify-jwt --project-ref "$PROJECT_REF"
